# This is the workflow which runs different version of python

name: matrix

on:
    push:
        branches: [main]

jobs:
    matrix:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            # fail-fast: true

            matrix:
                # This will create combinations for both Operating Systems
                os: [ubuntu-latest, macos-latest]
                python-version: ["3.10" , "3.11" , "3.12"]

                # This will exclude 3.10 for macOS 
                exclude:
                    - os: macos-latest
                      python-version: "3.10"

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with: 
                    python-version: ${{ matrix.python-version }}

            - name: Simulated Test Step
              run: |
                # If this is Python 3.10 on Ubuntu, force a failure
                if [[ "${{ matrix.python-version }}" == "3.10" && "${{ matrix.os }}" == "ubuntu-latest" ]]; then
                    echo "Intentional failure triggered!"
                    exit 1
                fi
                echo "Test passed on ${{ matrix.os }} with Python ${{ matrix.python-version }}"
             
