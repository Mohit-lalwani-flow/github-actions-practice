# This is the workflow in which we github runner

name: github runner

on:
    push:
        branches: [main]

jobs:
    github-runner:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix: 
                os: [ubuntu-latest , windows-latest , macos-latest]

        # This forces Windows to use Bash, allowing universal commands
        defaults:
          run:
            shell: bash
        
        steps:
            - name: Print runner information
              run: |
                # If this is OS is Linux and MacOS then command are 
                if [[ "${{ matrix.os }}" == "ubuntu-latest" && "${{ matrix.os }}" == "macos-latest" ]]; then
                echo "OS name : $RUNNER_OS"
                echo "Hostname : $(hostname)"
                echo "Current user : $(whoami)"
                




